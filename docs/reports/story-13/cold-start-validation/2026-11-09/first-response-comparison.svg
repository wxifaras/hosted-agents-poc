<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img" aria-labelledby="title description">
<title id="title">How long did the first response take?</title>
<desc id="description">Shorter bars mean less time. Each bar is the median of the passing, native-confirmed cold starts. Missing data is not zero.</desc>
<rect width="960" height="388" fill="white"/>
<g font-family="sans-serif" fill="#162b40">
<text x="24" y="30" font-size="24">How long did the first response take?</text>
<text x="24" y="56" font-size="16">Seconds until the first useful response. Lower is better.</text>
<text x="24" y="90" font-size="20">Without snapshots</text>
<rect class="comparison-bar" x="24" y="104" width="700.000" height="26" rx="5" fill="#566877"/>
<text x="736.000" y="125" font-size="22">6.39 s</text>
<text x="24" y="155" font-size="15">10 confirmed cold starts</text>
<text x="24" y="186" font-size="20">With memory snapshots</text>
<rect class="comparison-bar" x="24" y="200" width="160.081" height="26" rx="5" fill="#007f75"/>
<text x="196.081" y="221" font-size="22">1.46 s</text>
<text x="24" y="251" font-size="15">10 confirmed cold starts</text>
<text x="24" y="282" font-size="20">Snapshots + precompiled Python</text>
<rect class="comparison-bar" x="24" y="296" width="149.129" height="26" rx="5" fill="#2563eb"/>
<text x="185.129" y="317" font-size="22">1.36 s</text>
<text x="24" y="347" font-size="15">10 confirmed cold starts</text>
</g></svg>