# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: hosted-agents-poc
requiredVersions:
  azd: '>=1.36.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.19'
services:
  supervisor-agent:
    host: azure.ai.agent
    kind: hosted
    name: supervisor-agent
    description: MAF Supervisor smoke and explicit durable workflow delegation to two specialist conversations.
    sessionConfiguration:
      idleTimeoutSeconds: 120
    project: .
    language: docker
    docker:
      path: src/backend/Dockerfile
      context: .
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      ENVIRONMENT: hosted
      POC_AGENT_NAME: supervisor
      POC_ENABLE_IDENTITY_TESTS: 'true'
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  research-agent:
    host: azure.ai.agent
    kind: hosted
    name: research-agent
    description: MAF Research host; Story 4 Microsoft Learn MCP search via a Foundry toolbox when TOOLBOX_ENDPOINT is set.
    sessionConfiguration:
      idleTimeoutSeconds: 120
    project: .
    language: docker
    docker:
      path: src/backend/Dockerfile
      context: .
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      ENVIRONMENT: hosted
      POC_AGENT_NAME: research
      POC_ENABLE_IDENTITY_TESTS: 'true'
      TOOLBOX_ENDPOINT: ${RESEARCH_TOOLBOX_ENDPOINT}
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
  data-analysis-agent:
    host: azure.ai.agent
    kind: hosted
    name: data-analysis-agent
    description: Existing Data Analysis host; owner-bound native Story 1 Code Interpreter and original session files.
    sessionConfiguration:
      idleTimeoutSeconds: 120
    project: .
    language: docker
    docker:
      path: src/backend/Dockerfile
      context: .
      remoteBuild: true
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      ENVIRONMENT: hosted
      POC_AGENT_NAME: data_analysis
      STORY1_NATIVE_ENABLED: 'true'
      STORY1_NATIVE_PRESSURE_ENABLED: 'false'
      STORY1_NATIVE_TIMEOUT_SECONDS: '300'
      STORY1_NATIVE_MAX_OUTPUT_BYTES: '52428800'
      POC_APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
      POC_APPLICATIONINSIGHTS_AUTH_MODE: entra
    container:
      resources:
        cpu: '0.5'
        memory: 1Gi
infra:
  provider: bicep
  path: infra
  module: main
hooks:
  preprovision:
    shell: pwsh
    run: ./scripts/deploy/check_provision_inputs.ps1
    interactive: false
    continueOnError: false
