[project]
name = "story13-cold-start"
version = "0.1.0"
description = "Isolated, no-model Foundry hosted-agent startup experiment."
requires-python = ">=3.14,<3.15"
dependencies = [
    "azure-ai-agentserver-core==2.3.0",
    "azure-ai-agentserver-responses==2.4.0",
    "azure-ai-projects==2.10.0",
    "azure-identity==1.25.3",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "httpx==0.28.1",
    "markdown-it-py==4.2.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
]

[[tool.uv.index]]
name = "package-feed-proxy"
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["main.py", "measure.py", "report.py", "publish.py"]
